<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel Administrativo - NMM</title>
<style>
  :root{
    --bg:#F4F6F7; --surface:#FFFFFF; --surface-2:#EFF2F3; --border:#D7DEE1;
    --text:#182126; --muted:#5C6B73; --primary:#1E3A4C; --accent:#0E7C66;
    --accent-ink:#FFFFFF; --accent-soft:#E4F2EE; --danger:#B3261E; --danger-soft:#FBEAE9;
    --radius:10px; --shadow:0 1px 2px rgba(20,30,35,.06), 0 8px 24px -12px rgba(20,30,35,.18);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#111718; --surface:#181F21; --surface-2:#1E2628; --border:#313B3E;
      --text:#EAF0EF; --muted:#9AABAF; --primary:#DCE7EA; --accent:#39B695;
      --accent-ink:#08211B; --accent-soft:#173029; --danger:#E5837C; --danger-soft:#3A1F1E;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,-apple-system,sans-serif}
  [hidden]{display:none !important}
  .center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
  .loginCard{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:28px 26px}
  .mark{width:44px;height:44px;border-radius:10px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;margin-bottom:14px}
  .loginCard h1{font-size:18px;margin:0 0 4px}
  .loginCard p{font-size:13px;color:var(--muted);margin:0 0 18px}
  .field{margin-bottom:14px}
  label{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
  input[type=email],input[type=password],input[type=text]{width:100%;font:inherit;font-size:14.5px;padding:10px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text)}
  input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(14,124,102,.2)}
  button{font:inherit;cursor:pointer}
  .btn{padding:12px 18px;border:0;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:14.5px;width:100%}
  .btn:disabled{opacity:.55;cursor:not-allowed}
  .loginErr{display:none;margin-top:12px;padding:10px 12px;border-radius:8px;background:var(--danger-soft);color:var(--danger);font-size:13px}
  .loginErr.show{display:block}
  header.top{display:flex;align-items:center;gap:12px;padding:16px 20px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5}
  header.top .mark{margin:0;width:36px;height:36px;font-size:12px}
  header.top h1{font-size:15px;margin:0;flex:1}
  .iconbtn{background:none;border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:13px;color:var(--text)}
  main{max-width:900px;margin:0 auto;padding:18px 16px 40px}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:16px}
  .stat{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:12px 14px}
  .stat .n{font-size:20px;font-weight:800}
  .stat .l{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .toolbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .toolbar input, .toolbar select{font:inherit;font-size:13.5px;padding:9px 11px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text)}
  .toolbar input{flex:1;min-width:160px}
  .list{display:flex;flex-direction:column;gap:10px}
  .item{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:14px 16px;cursor:pointer}
  .item .row{display:flex;justify-content:space-between;gap:10px;align-items:center}
  .item .name{font-weight:700;font-size:14.5px}
  .item .sub{font-size:12.5px;color:var(--muted);margin-top:3px}
  .badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;text-transform:uppercase;letter-spacing:.03em}
  .badge.novo{background:var(--accent-soft);color:var(--accent)}
  .badge.em_analise{background:#FFF3D6;color:#8A6100}
  .badge.aprovado{background:#DFF2E1;color:#1E7B34}
  .badge.descartado{background:var(--danger-soft);color:var(--danger)}
  .empty{text-align:center;color:var(--muted);padding:60px 20px;font-size:14px}
  .panorama{background:var(--surface);border:1px solid var(--border);border-radius:9px;margin-bottom:16px;overflow:hidden}
  .panorama summary{padding:13px 16px;cursor:pointer;font-weight:700;font-size:13.5px;list-style:none;display:flex;align-items:center;justify-content:space-between}
  .panorama summary::-webkit-details-marker{display:none}
  .panorama summary .chev{color:var(--muted);font-size:12px;transition:transform .15s}
  .panorama[open] summary .chev{transform:rotate(90deg)}
  .panorama-body{padding:4px 16px 16px;display:grid;grid-template-columns:1fr;gap:16px}
  @media (min-width:640px){.panorama-body{grid-template-columns:1fr 1fr}}
  .panorama-col h4{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:0 0 8px}
  .bar-row{display:flex;align-items:center;gap:8px;font-size:12.5px;margin-bottom:6px}
  .bar-row .bar-label{flex:none;width:118px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bar-row .bar-track{flex:1;height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
  .bar-row .bar-fill{height:100%;background:var(--accent);border-radius:99px}
  .bar-row .bar-n{flex:none;width:22px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
  .treino-body{padding:4px 16px 16px}
  .treino-form{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--border)}
  @media (min-width:640px){.treino-form{grid-template-columns:1fr 1fr}}
  .treino-form .field{margin-bottom:0}
  .treino-form select{width:100%;font:inherit;font-size:14.5px;padding:10px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text)}
  .treino-list{display:flex;flex-direction:column;gap:8px}
  .treino-group h4{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:14px 0 6px}
  .treino-item{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface-2);border-radius:8px;padding:9px 12px;font-size:13.5px}
  .treino-item a{color:var(--accent);text-decoration:none}
  .treino-item a:hover{text-decoration:underline}
  .treino-item .tag{font-size:11px;color:var(--muted);text-transform:uppercase;margin-left:6px}
  .treino-item button{background:none;border:0;color:var(--danger);font-size:12.5px;cursor:pointer;padding:4px 6px}
  .maintabs{display:flex;gap:8px;margin-bottom:16px;border-bottom:1px solid var(--border)}
  .tabbtn{background:none;border:0;padding:10px 4px;margin-right:16px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}
  .tabbtn.active{color:var(--accent);border-bottom-color:var(--accent)}
  .fin-item{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:12px 14px}
  .fin-item .fin-main{min-width:0}
  .fin-item .fin-desc{font-weight:600;font-size:14px}
  .fin-item .fin-sub{font-size:12px;color:var(--muted);margin-top:2px}
  .fin-item .fin-valor{font-weight:800;font-size:15px;white-space:nowrap}
  .fin-valor.entrada{color:#1E7B34}
  .fin-valor.saida{color:var(--danger)}
  .fin-actions{display:flex;align-items:center;gap:8px;flex:none}
  .fin-actions a{font-size:12.5px}
  .fin-actions button{background:none;border:1px solid var(--border);border-radius:6px;font-size:12px;padding:5px 9px;cursor:pointer;color:var(--text)}
  .fin-actions button.danger{color:var(--danger);border-color:var(--danger-soft)}
  .fin-badge{font-size:11px;padding:3px 8px;border-radius:99px;text-transform:uppercase;font-weight:700;letter-spacing:.03em}
  .fin-badge.pago{background:var(--accent-soft);color:var(--accent)}
  .fin-badge.pendente{background:#FFF3D6;color:#8A6100}
  .overlay{position:fixed;inset:0;background:var(--bg);z-index:20;overflow-y:auto}
  .detailHead{display:flex;align-items:center;gap:12px;padding:16px 20px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0}
  .detailHead h2{font-size:15px;margin:0;flex:1}
  .detailBody{max-width:720px;margin:0 auto;padding:18px 16px 40px}
  .section{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:16px 18px;margin-bottom:12px}
  .section h3{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);margin:0 0 12px}
  .kv{display:grid;grid-template-columns:1fr;gap:10px}
  .kv .k{font-size:11.5px;color:var(--muted);text-transform:uppercase}
  .kv .v{font-size:14px;margin-top:2px;word-break:break-word}
  .statusRow{display:flex;gap:10px;align-items:center}
  .statusRow select{flex:1}
  .img-box{width:100%;max-width:280px;border-radius:8px;overflow:hidden;border:1px solid var(--border);background:var(--surface-2);min-height:120px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px}
  .img-box img{width:100%;display:block}
  .spinner{width:15px;height:15px;border-radius:50%;border:2px solid var(--accent-ink);border-top-color:transparent;animation:spin .7s linear infinite;display:inline-block}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div id="loginView" class="center">
  <div class="loginCard">
    <div class="mark">NMM</div>
    <h1>Painel Administrativo</h1>
    <p>Acesso restrito à equipe NMM.</p>
    <form id="loginForm">
      <div class="field">
        <label for="loginEmail">E-mail</label>
        <input type="email" id="loginEmail" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false">
      </div>
      <div class="field">
        <label for="loginPassword">Senha</label>
        <input type="password" id="loginPassword" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false">
      </div>
      <button type="submit" class="btn" id="loginBtn"><span id="loginBtnLabel">Entrar</span></button>
      <div class="loginErr" id="loginErr"></div>
    </form>
  </div>
</div>

<div id="appView" hidden>
  <header class="top">
    <div class="mark">NMM</div>
    <h1>Cadastros de Profissionais Autônomos</h1>
    <button class="iconbtn" id="logoutBtn">Sair</button>
  </header>
  <main>
    <div class="maintabs">
      <button type="button" class="tabbtn active" id="tabBtnCadastros">Cadastros</button>
      <button type="button" class="tabbtn" id="tabBtnFinanceiro">Financeiro</button>
    </div>

    <div id="tabCadastros" class="tabpane">
    <div class="stats" id="stats"></div>

    <details class="panorama" id="panorama">
      <summary>Panorama dos cadastros <span class="chev">&#9656;</span></summary>
      <div class="panorama-body">
        <div class="panorama-col">
          <h4>Cidades de atuação</h4>
          <div id="panoramaCidades"></div>
        </div>
        <div class="panorama-col">
          <h4>Funções com experiência</h4>
          <div id="panoramaExperiencia"></div>
        </div>
        <div class="panorama-col">
          <h4>Funções pretendidas</h4>
          <div id="panoramaPretendidas"></div>
        </div>
        <div class="panorama-col">
          <h4>Funções que querem aprender</h4>
          <div id="panoramaAprender"></div>
        </div>
      </div>
    </details>

    <details class="panorama" id="treinamentosPanel">
      <summary>Treinamentos por função <span class="chev">&#9656;</span></summary>
      <div class="treino-body">
        <form id="treinoForm" class="treino-form">
          <div class="field">
            <label for="treinoFuncao">Função</label>
            <select id="treinoFuncao" required></select>
          </div>
          <div class="field">
            <label for="treinoTitulo">Título do treinamento</label>
            <input type="text" id="treinoTitulo" required placeholder="Ex.: Como operar o caixa">
          </div>
          <div class="field">
            <label for="treinoTipo">Tipo</label>
            <select id="treinoTipo">
              <option value="video">Vídeo (link)</option>
              <option value="pdf">PDF (arquivo)</option>
            </select>
          </div>
          <div class="field" id="treinoUrlWrap">
            <label for="treinoUrl">Link do vídeo</label>
            <input type="text" id="treinoUrl" placeholder="https://...">
          </div>
          <div class="field" id="treinoFileWrap" hidden>
            <label for="treinoFile">Arquivo PDF</label>
            <input type="file" id="treinoFile" accept="application/pdf">
          </div>
          <button type="submit" class="btn" id="treinoSaveBtn" style="width:auto;padding:10px 16px">Adicionar treinamento</button>
          <div class="loginErr" id="treinoErr"></div>
        </form>
        <div class="treino-list" id="treinoList"></div>
      </div>
    </details>

    <div class="toolbar">
      <input type="text" id="searchInput" placeholder="Buscar por nome, CPF ou cidade...">
      <select id="statusFilter">
        <option value="">Todos os status</option>
        <option value="novo">Novo</option>
        <option value="em_analise">Em análise</option>
        <option value="aprovado">Aprovado</option>
        <option value="descartado">Descartado</option>
      </select>
      <select id="cidadeFilter">
        <option value="">Todas as cidades</option>
      </select>
      <select id="funcaoFilter">
        <option value="">Todas as funções</option>
      </select>
    </div>
    <div class="list" id="listArea"></div>
    </div>

    <div id="tabFinanceiro" class="tabpane" hidden>
      <div class="stats" id="finStats"></div>

      <div class="panorama" style="margin-bottom:16px">
        <div style="padding:13px 16px;font-weight:700;font-size:13.5px" id="finFormTitle">Novo lançamento</div>
        <form id="finForm" class="treino-form" style="padding:4px 16px 16px;border:0">
          <div class="field">
            <label for="finTipo">Tipo</label>
            <select id="finTipo">
              <option value="saida">Saída (despesa)</option>
              <option value="entrada">Entrada (receita)</option>
            </select>
          </div>
          <div class="field">
            <label for="finCategoria">Categoria</label>
            <select id="finCategoria"></select>
          </div>
          <div class="field">
            <label for="finDescricao">Descrição</label>
            <input type="text" id="finDescricao" placeholder="Ex.: Combustível do carro">
          </div>
          <div class="field">
            <label for="finValor">Valor (R$)</label>
            <input type="text" id="finValor" inputmode="decimal" placeholder="0,00">
          </div>
          <div class="field">
            <label for="finData">Data</label>
            <input type="date" id="finData">
          </div>
          <div class="field">
            <label for="finStatus">Status</label>
            <select id="finStatus">
              <option value="pago">Pago/Recebido</option>
              <option value="pendente">Pendente (conta a pagar/receber)</option>
            </select>
          </div>
          <div class="field" id="finVencimentoWrap" hidden>
            <label for="finVencimento">Vencimento</label>
            <input type="date" id="finVencimento">
          </div>
          <div class="field">
            <label for="finComprovante">Comprovante <span class="opt">(opcional)</span></label>
            <input type="file" id="finComprovante" accept="image/*,.pdf">
            <div id="finComprovanteAtual" style="font-size:12px;color:var(--muted);margin-top:4px"></div>
          </div>
          <div style="display:flex;gap:10px">
            <button type="submit" class="btn" id="finSaveBtn" style="width:auto;padding:10px 16px">Lançar</button>
            <button type="button" class="iconbtn" id="finCancelEditBtn" hidden>Cancelar edição</button>
          </div>
          <div class="loginErr" id="finErr"></div>
        </form>
      </div>

      <div class="toolbar">
        <select id="finTipoFilter">
          <option value="">Todos os tipos</option>
          <option value="entrada">Entradas</option>
          <option value="saida">Saídas</option>
        </select>
        <select id="finStatusFilter">
          <option value="">Todos os status</option>
          <option value="pago">Pago/Recebido</option>
          <option value="pendente">Pendente</option>
        </select>
        <select id="finCategoriaFilter">
          <option value="">Todas as categorias</option>
        </select>
      </div>
      <div class="list" id="finList"></div>
    </div>
  </main>
</div>

<div id="detailView" class="overlay" hidden>
  <div class="detailHead">
    <button class="iconbtn" id="backBtn">&larr; Voltar</button>
    <h2 id="detailName">Detalhe</h2>
  </div>
  <div class="detailBody" id="detailBody"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
(function(){
  var SUPABASE_URL = "https://ratkhskpvgvlperrtsvv.supabase.co";
  var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJhdGtoc2twdmd2bHBlcnJ0c3Z2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0MTE5MDAsImV4cCI6MjEwNDk4NzkwMH0.INk9i0RZ_n8OYs85Mh77EaW1vUHN6WszfYKSVe_dQgE";
  var sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  var loginView = document.getElementById("loginView");
  var appView = document.getElementById("appView");
  var detailView = document.getElementById("detailView");
  var loginForm = document.getElementById("loginForm");
  var loginBtn = document.getElementById("loginBtn");
  var loginBtnLabel = document.getElementById("loginBtnLabel");
  var loginErr = document.getElementById("loginErr");

  var candidatos = [];

  var STATUS_LABEL = {
    novo: "Novo",
    em_analise: "Em análise",
    aprovado: "Aprovado",
    descartado: "Descartado"
  };

  var CIDADES_OPTIONS = ["Braço do Norte","Capivari de Baixo","Criciúma","Imbituba","Laguna","Orleans","Sombrio","Tubarão"];
  var FUNCOES_OPTIONS = ["Açougueiro","Atendente","Auxiliar de Açougue","Auxiliar de Cozinha","Auxiliar de Padaria","Balconista","Caixa","Carga e Descarga","Chapeiro","Churrasqueiro","Confeiteiro","Conferente","Cozinheira","Degustador","Estoquista","Faxineira","Fiscal de Caixa","FLC (Frios, Laticínios, Congelados)","FLV (Frutas, Legumes, Verduras)","Garçom","Hortifruti","Limpeza","Limpeza Pesada","Mercearia","Motoboy","Motorista AB","Motorista ABC","Motorista ABCD","Padeiro","Panificador","Recepcionista","Repositor","Telefonista","Vendedor","Outros"];

  function populateFilterOptions(){
    var cidadeSel = document.getElementById("cidadeFilter");
    CIDADES_OPTIONS.forEach(function(c){
      var opt = document.createElement("option");
      opt.value = c; opt.textContent = c;
      cidadeSel.appendChild(opt);
    });
    var funcaoSel = document.getElementById("funcaoFilter");
    FUNCOES_OPTIONS.forEach(function(f){
      var opt = document.createElement("option");
      opt.value = f; opt.textContent = f;
      funcaoSel.appendChild(opt);
    });
  }
  populateFilterOptions();

  var treinamentos = [];
  var treinoForm = document.getElementById("treinoForm");
  var treinoFuncao = document.getElementById("treinoFuncao");
  var treinoTitulo = document.getElementById("treinoTitulo");
  var treinoTipo = document.getElementById("treinoTipo");
  var treinoUrl = document.getElementById("treinoUrl");
  var treinoFile = document.getElementById("treinoFile");
  var treinoUrlWrap = document.getElementById("treinoUrlWrap");
  var treinoFileWrap = document.getElementById("treinoFileWrap");
  var treinoErr = document.getElementById("treinoErr");
  var treinoSaveBtn = document.getElementById("treinoSaveBtn");

  FUNCOES_OPTIONS.forEach(function(f){
    var opt = document.createElement("option");
    opt.value = f; opt.textContent = f;
    treinoFuncao.appendChild(opt);
  });

  treinoTipo.addEventListener("change", function(){
    var isPdf = treinoTipo.value === "pdf";
    treinoFileWrap.hidden = !isPdf;
    treinoUrlWrap.hidden = isPdf;
  });

  function slugify(s){
    return String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-zA-Z0-9]+/g,"-").toLowerCase().replace(/(^-|-$)/g,"");
  }

  function loadTreinamentos(){
    sb.from("treinamentos").select("*").order("funcao").order("created_at").then(function(res){
      if (res.error){
        document.getElementById("treinoList").innerHTML = '<div class="empty">Erro ao carregar: ' + res.error.message + '</div>';
        return;
      }
      treinamentos = res.data || [];
      renderTreinamentos();
    });
  }

  function renderTreinamentos(){
    var el = document.getElementById("treinoList");
    if (!treinamentos.length){
      el.innerHTML = '<div class="empty">Nenhum treinamento cadastrado ainda.</div>';
      return;
    }
    var porFuncao = {};
    treinamentos.forEach(function(t){
      if (!porFuncao[t.funcao]) porFuncao[t.funcao] = [];
      porFuncao[t.funcao].push(t);
    });
    var funcoes = Object.keys(porFuncao).sort();
    el.innerHTML = funcoes.map(function(f){
      var itens = porFuncao[f].map(function(t){
        return '<div class="treino-item" data-id="' + t.id + '">' +
          '<div><a href="' + esc(t.url) + '" target="_blank" rel="noopener">' + esc(t.titulo) + '</a><span class="tag">' + (t.tipo === "pdf" ? "PDF" : "Vídeo") + '</span></div>' +
          '<button type="button" class="delTreinoBtn" data-id="' + t.id + '">Excluir</button>' +
        '</div>';
      }).join("");
      return '<div class="treino-group"><h4>' + esc(f) + '</h4>' + itens + '</div>';
    }).join("");
    Array.prototype.forEach.call(el.querySelectorAll(".delTreinoBtn"), function(btn){
      btn.addEventListener("click", function(){
        var id = btn.getAttribute("data-id");
        if (!confirm("Excluir este treinamento?")) return;
        sb.from("treinamentos").delete().eq("id", id).then(function(res){
          if (res.error){ alert("Erro ao excluir: " + res.error.message); return; }
          loadTreinamentos();
        });
      });
    });
  }

  treinoForm.addEventListener("submit", function(e){
    e.preventDefault();
    treinoErr.classList.remove("show");
    var funcao = treinoFuncao.value;
    var titulo = treinoTitulo.value.trim();
    var tipo = treinoTipo.value;

    if (!funcao || !titulo){
      treinoErr.textContent = "Preencha a função e o título.";
      treinoErr.classList.add("show");
      return;
    }

    treinoSaveBtn.disabled = true;
    treinoSaveBtn.textContent = "Salvando...";

    function inserirTreinamento(url){
      return sb.from("treinamentos").insert({ funcao: funcao, tipo: tipo, titulo: titulo, url: url }).then(function(res){
        treinoSaveBtn.disabled = false;
        treinoSaveBtn.textContent = "Adicionar treinamento";
        if (res.error){
          treinoErr.textContent = "Erro ao salvar: " + res.error.message;
          treinoErr.classList.add("show");
          return;
        }
        treinoForm.reset();
        treinoTipo.dispatchEvent(new Event("change"));
        loadTreinamentos();
      });
    }

    if (tipo === "pdf"){
      var file = treinoFile.files[0];
      if (!file){
        treinoSaveBtn.disabled = false;
        treinoSaveBtn.textContent = "Adicionar treinamento";
        treinoErr.textContent = "Selecione um arquivo PDF.";
        treinoErr.classList.add("show");
        return;
      }
      var path = "treinamentos/" + slugify(funcao) + "/" + Date.now() + "-" + file.name;
      sb.storage.from("public-assets").upload(path, file, { contentType: "application/pdf" }).then(function(res){
        if (res.error){
          treinoSaveBtn.disabled = false;
          treinoSaveBtn.textContent = "Adicionar treinamento";
          treinoErr.textContent = "Erro ao enviar arquivo: " + res.error.message;
          treinoErr.classList.add("show");
          return;
        }
        var pub = sb.storage.from("public-assets").getPublicUrl(path);
        inserirTreinamento(pub.data.publicUrl);
      });
    } else {
      var url = treinoUrl.value.trim();
      if (!url){
        treinoSaveBtn.disabled = false;
        treinoSaveBtn.textContent = "Adicionar treinamento";
        treinoErr.textContent = "Informe o link do vídeo.";
        treinoErr.classList.add("show");
        return;
      }
      inserirTreinamento(url);
    }
  });

  var tabBtnCadastros = document.getElementById("tabBtnCadastros");

  var CATEGORIAS_SAIDA = ["Salários","Fornecedores","Aluguel","Impostos","Combustível","Manutenção","Marketing","Contas a pagar diversas","Outros"];
  var CATEGORIAS_ENTRADA = ["Prestação de serviços","Vendas","Investimento recebido","Outros"];

  var lancamentos = [];
  var finForm = document.getElementById("finForm");
  var finTipo = document.getElementById("finTipo");
  var finCategoria = document.getElementById("finCategoria");
  var finDescricao = document.getElementById("finDescricao");
  var finValor = document.getElementById("finValor");

  var finStatus = document.getElementById("finStatus");
  var finVencimento = document.getElementById("finVencimento");

  function popularCategoriasFin(){
    var lista = finTipo.value === "entrada" ? CATEGORIAS_ENTRADA : CATEGORIAS_SAIDA;
    finCategoria.innerHTML = lista.map(function(c){ return '<option value="' + escAttrFin(c) + '">' + c + '</option>'; }).join("");
  }
  function escAttrFin(s){ return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;"); }
  popularCategoriasFin();
  finTipo.addEventListener("change", popularCategoriasFin);

  finStatus.addEventListener("change", function(){
    finVencimentoWrap.hidden = finStatus.value !== "pendente";
  });

  finData.valueAsDate = new Date();

  function populateCategoriaFilter(){
    var sel = document.getElementById("finCategoriaFilter");
    var todas = CATEGORIAS_SAIDA.concat(CATEGORIAS_ENTRADA).filter(function(c, i, arr){ return arr.indexOf(c) === i; });
    todas.forEach(function(c){
      var opt = document.createElement("option");
      opt.value = c; opt.textContent = c;
      sel.appendChild(opt);
    });

  populateCategoriaFilter();

  function fmtMoeda(v){
    return (Number(v) || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
  }

  function loadFinanceiro(){
    sb.from("financeiro_lancamentos").select("*").order("data", { ascending: false }).then(function(res){
      if (res.error){
        document.getElementById("finList").innerHTML = '<div class="empty">Erro ao carregar: ' + res.error.message + '</div>';
        return;
      }
      lancamentos = res.data || [];
      renderFinStats();
      renderFinList();
    });
  }

  function renderFinStats(){
    var totalEntradas = lancamentos.filter(function(l){ return l.tipo === "entrada" && l.status === "pago"; })
      .reduce(function(s,l){ return s + Number(l.valor); }, 0);
    var totalSaidas = lancamentos.filter(function(l){ return l.tipo === "saida" && l.status === "pago"; })
      .reduce(function(s,l){ return s + Number(l.valor); }, 0);
    var saldo = totalEntradas - totalSaidas;
    var aPagar = lancamentos.filter(function(l){ return l.tipo === "saida" && l.status === "pendente"; })
      .reduce(function(s,l){ return s + Number(l.valor); }, 0);
    var aReceber = lancamentos.filter(function(l){ return l.tipo === "entrada" && l.status === "pendente"; })
      .reduce(function(s,l){ return s + Number(l.valor); }, 0);
    document.getElementById("finStats").innerHTML =
      '<div class="stat"><div class="n">' + fmtMoeda(totalEntradas) + '</div><div class="l">Entradas</div></div>' +
      '<div class="stat"><div class="n">' + fmtMoeda(totalSaidas) + '</div><div class="l">Saídas</div></div>' +
      '<div class="stat"><div class="n">' + fmtMoeda(saldo) + '</div><div class="l">Saldo</div></div>' +
      '<div class="stat"><div class="n">' + fmtMoeda(aPagar) + '</div><div class="l">A pagar</div></div>' +
      '<div class="stat"><div class="n">' + fmtMoeda(aReceber) + '</div><div class="l">A receber</div></div>';
  }

  function renderFinList(){
    var tipoF = document.getElementById("finTipoFilter").value;
    var statusF = document.getElementById("finStatusFilter").value;
    var catF = document.getElementById("finCategoriaFilter").value;
    var filtrados = lancamentos.filter(function(l){
      if (tipoF && l.tipo !== tipoF) return false;
      if (statusF && l.status !== statusF) return false;
      if (catF && l.categoria !== catF) return false;
      return true;
    });
    var el = document.getElementById("finList");
    if (!filtrados.length){
      el.innerHTML = '<div class="empty">Nenhum lançamento encontrado.</div>';
      return;
    }
    el.innerHTML = filtrados.map(function(l){
      var dataStr = new Date(l.data + "T00:00:00").toLocaleDateString("pt-BR");
      var vencStr = l.vencimento ? (" &middot; vence " + new Date(l.vencimento + "T00:00:00").toLocaleDateString("pt-BR")) : "";
      return '<div class="fin-item" data-id="' + l.id + '">' +
        '<div class="fin-main">' +
          '<div class="fin-desc">' + esc(l.categoria) + (l.descricao ? " — " + esc(l.descricao) : "") + '</div>' +
          '<div class="fin-sub">' + dataStr + vencStr + ' <span class="fin-badge ' + l.status + '">' + (l.status === "pago" ? (l.tipo === "entrada" ? "Recebido" : "Pago") : "Pendente") + '</span></div>' +
        '</div>' +
        '<div class="fin-actions">' +
          '<div class="fin-valor ' + l.tipo + '">' + (l.tipo === "saida" ? "-" : "+") + " " + fmtMoeda(l.valor) + '</div>' +
          (l.comprovante_path ? '<button type="button" class="verComprovanteBtn" data-path="' + esc(l.comprovante_path) + '">Comprovante</button>' : "") +
          (l.status === "pendente" ? '<button type="button" class="marcarPagoBtn" data-id="' + l.id + '">Marcar como pago</button>' : "") +
          '<button type="button" class="editFinBtn" data-id="' + l.id + '">Editar</button>' +
          '<button type="button" class="danger delFinBtn" data-id="' + l.id + '">Excluir</button>' +
        '</div>' +
      '</div>';
    }).join("");

    Array.prototype.forEach.call(el.querySelectorAll(".verComprovanteBtn"), function(btn){
      btn.addEventListener("click", function(){
        var path = btn.getAttribute("data-path");
        sb.storage.from("financeiro-docs").createSignedUrl(path, 300).then(function(res){
          if (res.error || !res.data){ alert("Não foi possível abrir o comprovante."); return; }
          window.open(res.data.signedUrl, "_blank");
        });
      });
    });
    Array.prototype.forEach.call(el.querySelectorAll(".marcarPagoBtn"), function(btn){
      btn.addEventListener("click", function(){
        var id = btn.getAttribute("data-id");
        sb.from("financeiro_lancamentos").update({ status: "pago" }).eq("id", id).then(function(res){
          if (res.error){ alert("Erro ao atualizar: " + res.error.message); return; }
          loadFinanceiro();
        });
      });
    });
    Array.prototype.forEach.call(el.querySelectorAll(".delFinBtn"), function(btn){
      btn.addEventListener("click", function(){
        var id = btn.getAttribute("data-id");
        if (!confirm("Excluir este lançamento?")) return;
        sb.from("financeiro_lancamentos").delete().eq("id", id).then(function(res){
          if (res.error){ alert("Erro ao excluir: " + res.error.message); return; }
          if (finEditId === id) cancelarEdicaoFin();
          loadFinanceiro();
        });
      });
    });
    Array.prototype.forEach.call(el.querySelectorAll(".editFinBtn"), function(btn){
      btn.addEventListener("click", function(){
        var id = btn.getAttribute("data-id");
        var l = lancamentos.filter(function(x){ return x.id === id; })[0];
        if (!l) return;
        iniciarEdicaoFin(l);
      });
    });
  }

  var finEditId = null;
  var finCancelEditBtn = document.getElementById("finCancelEditBtn");
  var finFormTitle = document.getElementById("finFormTitle");
  var finComprovanteAtual = document.getElementById("finComprovanteAtual");

  function iniciarEdicaoFin(l){
    finEditId = l.id;
    finTipo.value = l.tipo;
    popularCategoriasFin();
    finCategoria.value = l.categoria;
    finDescricao.value = l.descricao || "";
    finValor.value = (Number(l.valor) || 0).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    finData.value = l.data;
    finStatus.value = l.status;
    finVencimentoWrap.hidden = l.status !== "pendente";
    finVencimento.value = l.vencimento || "";
    finComprovante.value = "";
    finComprovanteAtual.textContent = l.comprovante_path ? "Já existe um comprovante anexado. Envie um novo arquivo apenas se quiser substituí-lo." : "";
    finFormTitle.textContent = "Editando lançamento";
    finSaveBtn.textContent = "Salvar alterações";
    finCancelEditBtn.hidden = false;
    finForm.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function cancelarEdicaoFin(){
    finEditId = null;
    finForm.reset();
    finData.valueAsDate = new Date();
    popularCategoriasFin();
    finVencimentoWrap.hidden = true;
    finComprovanteAtual.textContent = "";
    finFormTitle.textContent = "Novo lançamento";
    finSaveBtn.textContent = "Lançar";
    finCancelEditBtn.hidden = true;
  }

  finCancelEditBtn.addEventListener("click", cancelarEdicaoFin);

  ["finTipoFilter","finStatusFilter","finCategoriaFilter"].forEach(function(id){
    document.getElementById(id).addEventListener("change", renderFinList);
  });

  finForm.addEventListener("submit", function(e){
    e.preventDefault();
    finErr.classList.remove("show");

    var tipo = finTipo.value;
    var categoria = finCategoria.value;
    var descricao = finDescricao.value.trim();
    var valorStr = finValor.value.trim().replace(/\./g,"").replace(",",".");
    var valor = parseFloat(valorStr);
    var data = finData.value;
    var status = finStatus.value;
    var vencimento = status === "pendente" ? (finVencimento.value || null) : null;

    if (!valor || valor <= 0 || isNaN(valor)){
      finErr.textContent = "Informe um valor válido.";
      finErr.classList.add("show");
      return;
    }
    if (!data){
      finErr.textContent = "Informe a data.";
      finErr.classList.add("show");
      return;
    }

    var isEdit = !!finEditId;
    finSaveBtn.disabled = true;
    finSaveBtn.textContent = "Salvando...";

    function finalizarSalvar(res){
      finSaveBtn.disabled = false;
      if (res.error){
        finSaveBtn.textContent = isEdit ? "Salvar alterações" : "Lançar";
        finErr.textContent = "Erro ao salvar: " + res.error.message;
        finErr.classList.add("show");
        return;
      }
      cancelarEdicaoFin();
      loadFinanceiro();
    }

    function inserirLancamento(comprovantePath){
      return sb.from("financeiro_lancamentos").insert({
        tipo: tipo, categoria: categoria, descricao: descricao || null, valor: valor,
        data: data, status: status, vencimento: vencimento, comprovante_path: comprovantePath || null
      }).then(finalizarSalvar);
    }

    function atualizarLancamento(comprovantePath){
      var patch = {
        tipo: tipo, categoria: categoria, descricao: descricao || null, valor: valor,
        data: data, status: status, vencimento: vencimento
      };
      if (comprovantePath) patch.comprovante_path = comprovantePath;
      return sb.from("financeiro_lancamentos").update(patch).eq("id", finEditId).then(finalizarSalvar);
    }

    var file = finComprovante.files[0];
    if (file){
      var path = "financeiro/" + Date.now() + "-" + file.name;
      sb.storage.from("financeiro-docs").upload(path, file).then(function(res){
        if (res.error){
          finSaveBtn.disabled = false;
          finSaveBtn.textContent = isEdit ? "Salvar alterações" : "Lançar";
          finErr.textContent = "Erro ao enviar comprovante: " + res.error.message;
          finErr.classList.add("show");
          return;
        }
        if (isEdit) atualizarLancamento(path); else inserirLancamento(path);
      });
    } else {
      if (isEdit) atualizarLancamento(null); else inserirLancamento(null);
    }
  });

  loginForm.addEventListener("submit", function(e){
    e.preventDefault();
    loginErr.classList.remove("show");
    var email = document.getElementById("loginEmail").value.trim();
    var password = document.getElementById("loginPassword").value;
    loginBtn.disabled = true;
    loginBtnLabel.innerHTML = '<span class="spinner"></span> Entrando...';
    sb.auth.signInWithPassword({ email: email, password: password }).then(function(res){
      loginBtn.disabled = false;
      loginBtnLabel.textContent = "Entrar";
      if (res.error){
        var msg = "E-mail ou senha incorretos.";
        if (!/invalid login credentials/i.test(res.error.message || "")){
          msg = "Não foi possível entrar: " + res.error.message;
        }
        loginErr.textContent = msg;
        loginErr.classList.add("show");
        return;
      }
      showApp();
    }).catch(function(err){
      loginBtn.disabled = false;
      loginBtnLabel.textContent = "Entrar";
      loginErr.textContent = "Falha de conexão: " + (err && err.message ? err.message : err);
      loginErr.classList.add("show");
    });
  });

  document.getElementById("logoutBtn").addEventListener("click", function(){
    sb.auth.signOut().then(function(){
      appView.hidden = true;
      loginView.hidden = false;
    });
  });

  function showApp(){
    loginView.hidden = true;
    appView.hidden = false;
    loadCandidatos();
    loadTreinamentos();
    loadFinanceiro();
  }

  sb.auth.getSession().then(function(res){
    if (res.data && res.data.session){
      showApp();
    }
  });

  function loadCandidatos(){
    sb.from("candidatos").select("*").order("created_at", {ascending:false}).then(function(res){
      if (res.error){
        document.getElementById("listArea").innerHTML = '<div class="empty">Erro ao carregar: ' + res.error.message + '</div>';
        return;
      }
      candidatos = res.data || [];
      renderStats();
      renderList();
      renderPanorama();
    });
  }

  function contarValores(campo){
    var counts = {};
    candidatos.forEach(function(c){
      var raw = c[campo];
      if (!raw) return;
      raw.split(",").forEach(function(v){
        v = v.trim();
        if (!v) return;
        counts[v] = (counts[v] || 0) + 1;
      });
    });
    return Object.keys(counts).map(function(k){ return {label:k, n:counts[k]}; })
      .sort(function(a,b){ return b.n - a.n; });
  }

  function renderBarras(containerId, items){
    var el = document.getElementById(containerId);
    if (!items.length){
      el.innerHTML = '<div style="font-size:12.5px;color:var(--muted)">Sem dados</div>';
      return;
    }
    var max = items[0].n;
    el.innerHTML = items.map(function(it){
      var pct = max ? Math.round((it.n / max) * 100) : 0;
      return '<div class="bar-row">' +
        '<div class="bar-label" title="' + esc(it.label) + '">' + esc(it.label) + '</div>' +
        '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%"></div></div>' +
        '<div class="bar-n">' + it.n + '</div>' +
      '</div>';
    }).join("");
  }

  function renderPanorama(){
    renderBarras("panoramaCidades", contarValores("cidades_atuacao"));
    renderBarras("panoramaExperiencia", contarValores("funcoes_experiencia"));
    renderBarras("panoramaPretendidas", contarValores("funcoes_pretendidas"));
    renderBarras("panoramaAprender", contarValores("funcoes_aprender"));
  }

  function renderStats(){
    var novo = candidatos.filter(function(c){return c.status === "novo";}).length;
    var emAnalise = candidatos.filter(function(c){return c.status === "em_analise";}).length;
    var aprovado = candidatos.filter(function(c){return c.status === "aprovado";}).length;
    var descartado = candidatos.filter(function(c){return c.status === "descartado";}).length;
    document.getElementById("stats").innerHTML =
      statCard(candidatos.length, "Total") +
      statCard(novo, "Novos") +
      statCard(emAnalise, "Em análise") +
      statCard(aprovado, "Aprovados") +
      statCard(descartado, "Descartados");
  }
  function statCard(n, l){
    return '<div class="stat"><div class="n">' + n + '</div><div class="l">' + l + '</div></div>';
  }

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  function temFuncao(c, valor){
    var todas = [c.funcoes_experiencia, c.funcoes_pretendidas, c.funcoes_aprender].join(", ").toLowerCase();
    return todas.indexOf(valor.toLowerCase()) >= 0;
  }
  function temCidade(c, valor){
    return (c.cidades_atuacao || "").toLowerCase().indexOf(valor.toLowerCase()) >= 0;
  }

  function renderList(){
    var q = (document.getElementById("searchInput").value || "").toLowerCase();
    var statusF = document.getElementById("statusFilter").value;
    var cidadeF = document.getElementById("cidadeFilter").value;
    var funcaoF = document.getElementById("funcaoFilter").value;
    var filtered = candidatos.filter(function(c){
      if (statusF && c.status !== statusF) return false;
      if (cidadeF && !temCidade(c, cidadeF)) return false;
      if (funcaoF && !temFuncao(c, funcaoF)) return false;
      if (!q) return true;
      return (c.nome_completo||"").toLowerCase().indexOf(q) >= 0 ||
             (c.cpf||"").indexOf(q.replace(/\D/g,"")) >= 0 ||
             (c.cidades_atuacao||"").toLowerCase().indexOf(q) >= 0;
    });
    var el = document.getElementById("listArea");
    if (!filtered.length){
      el.innerHTML = '<div class="empty">Nenhum cadastro encontrado.</div>';
      return;
    }
    el.innerHTML = filtered.map(function(c){
      var d = new Date(c.created_at);
      var dateStr = d.toLocaleDateString("pt-BR") + " " + d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
      var statusLabel = STATUS_LABEL[c.status] || c.status;
      return '<div class="item" data-id="' + c.id + '">' +
        '<div class="row">' +
          '<div><div class="name">' + esc(c.nome_completo) + '</div>' +
          '<div class="sub">' + esc(c.cidades_atuacao) + ' &middot; ' + dateStr + '</div></div>' +
          '<span class="badge ' + esc(c.status) + '">' + esc(statusLabel) + '</span>' +
        '</div></div>';
    }).join("");
    Array.prototype.forEach.call(el.querySelectorAll(".item"), function(node){
      node.addEventListener("click", function(){
        openDetail(node.getAttribute("data-id"));
      });
    });
  }

  document.getElementById("searchInput").addEventListener("input", renderList);
  document.getElementById("statusFilter").addEventListener("change", renderList);
  document.getElementById("cidadeFilter").addEventListener("change", renderList);
  document.getElementById("funcaoFilter").addEventListener("change", renderList);

  function fmtCpf(cpf){
    cpf = (cpf||"").replace(/\D/g,"");
    if (cpf.length !== 11) return cpf;
    return cpf.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, "$1.$2.$3-$4");
  }

  function openDetail(id){
    var c = candidatos.filter(function(x){return x.id === id;})[0];
    if (!c) return;
    document.getElementById("detailName").textContent = c.nome_completo;
    var body = document.getElementById("detailBody");
    body.innerHTML =
      '<div class="section"><h3>Status</h3>' +
      '<div class="statusRow">' +
        '<select id="statusSelect">' +
          '<option value="novo"' + (c.status==="novo"?" selected":"") + '>Novo</option>' +
          '<option value="em_analise"' + (c.status==="em_analise"?" selected":"") + '>Em análise</option>' +
          '<option value="aprovado"' + (c.status==="aprovado"?" selected":"") + '>Aprovado</option>' +
          '<option value="descartado"' + (c.status==="descartado"?" selected":"") + '>Descartado</option>' +
        '</select>' +
        '<button class="btn" id="saveStatusBtn" style="width:auto;padding:10px 16px">Salvar</button>' +
      '</div></div>' +

      '<div class="section"><h3>Dados pessoais</h3><div class="kv">' +
        kv("Nome completo", c.nome_completo) +
        kv("CPF", fmtCpf(c.cpf)) +
        kv("Endereço", c.endereco) +
        kv("Cidades de atuação", c.cidades_atuacao) +
      '</div></div>' +

      '<div class="section"><h3>Experiência</h3><div class="kv">' +
        kv("Função com experiência", c.funcoes_experiencia) +
        kv("Pretende atuar", c.funcoes_pretendidas) +
        kv("Pretende aprender", c.funcoes_aprender) +
        (c.observacao ? kv("Observação", c.observacao) : "") +
      '</div></div>' +

      '<div class="section"><h3>Pagamento</h3><div class="kv">' +
        kv("Banco", c.pix_banco) +
        kv("Tipo de chave PIX", c.pix_tipo) +
        kv("Chave PIX", c.pix_chave) +
      '</div></div>' +

      '<div class="section"><h3>Documentos</h3>' +
        '<div style="display:flex;gap:12px;flex-wrap:wrap">' +
          '<div><div class="kv"><div class="k" style="margin-bottom:6px">Documento</div></div><div class="img-box" id="docBox">Carregando...</div></div>' +
          '<div><div class="kv"><div class="k" style="margin-bottom:6px">Foto atual</div></div><div class="img-box" id="fotoBox">Carregando...</div></div>' +
        '</div>' +
      '</div>' +

      '<div class="section"><h3>Cadastrado em</h3><div class="kv">' + kv("Data", new Date(c.created_at).toLocaleString("pt-BR")) + '</div></div>';

    document.getElementById("saveStatusBtn").addEventListener("click", function(){
      var newStatus = document.getElementById("statusSelect").value;
      saveStatus(c.id, newStatus);
    });

    loadFile(c.documento_path, "docBox");
    loadFile(c.foto_path, "fotoBox");

    detailView.hidden = false;
  }
  function kv(k, v){
    return '<div><div class="k">' + esc(k) + '</div><div class="v">' + esc(v) + '</div></div>';
  }

  function loadFile(path, boxId){
    var box = document.getElementById(boxId);
    if (!path){ box.textContent = "Não enviado"; return; }
    sb.storage.from("candidatos-docs").createSignedUrl(path, 300).then(function(res){
      if (res.error || !res.data){ box.textContent = "Indisponível"; return; }
      var url = res.data.signedUrl;
      if (/\.pdf($|\?)/i.test(path)){
        box.innerHTML = '<a href="' + url + '" target="_blank" rel="noopener">Abrir PDF</a>';
      } else {
        box.innerHTML = '<a href="' + url + '" target="_blank" rel="noopener"><img src="' + url + '"></a>';
      }
    });
  }

  function saveStatus(id, status){
    var btn = document.getElementById("saveStatusBtn");
    btn.disabled = true;
    btn.textContent = "Salvando...";
    sb.from("candidatos").update({status: status}).eq("id", id).then(function(res){
      btn.disabled = false;
      btn.textContent = "Salvar";
      if (res.error){
        alert("Erro ao salvar: " + res.error.message);
        return;
      }
      var c = candidatos.filter(function(x){return x.id === id;})[0];
      if (c) c.status = status;
      renderStats();
      renderList();
      renderPanorama();
    });
  }

  document.getElementById("backBtn").addEventListener("click", function(){
    detailView.hidden = true;
  });
})();
</script>
</body>
</html>
