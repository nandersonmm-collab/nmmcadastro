<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel Administrativo - NMM</title>
<style>
  :root{
    --bg:#F4F6F7; --surface:#FFFFFF; --surface-2:#EFF2F3; --border:#D7DEE1;
    --text:#182126; --muted:#5C6B73; --primary:#1E3A4C; --accent:#0E7C66;
    --accent-ink:#FFFFFF; --accent-soft:#E4F2EE; --danger:#B3261E; --danger-soft:#FBEAE9;
    --radius:10px; --shadow:0 1px 2px rgba(20,30,35,.06), 0 8px 24px -12px rgba(20,30,35,.18);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#111718; --surface:#181F21; --surface-2:#1E2628; --border:#313B3E;
      --text:#EAF0EF; --muted:#9AABAF; --primary:#DCE7EA; --accent:#39B695;
      --accent-ink:#08211B; --accent-soft:#173029; --danger:#E5837C; --danger-soft:#3A1F1E;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,-apple-system,sans-serif}
  [hidden]{display:none !important}
  .center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
  .loginCard{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:28px 26px}
  .mark{width:44px;height:44px;border-radius:10px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;margin-bottom:14px}
  .loginCard h1{font-size:18px;margin:0 0 4px}
  .loginCard p{font-size:13px;color:var(--muted);margin:0 0 18px}
  .field{margin-bottom:14px}
  label{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
  input[type=email],input[type=password],input[type=text]{width:100%;font:inherit;font-size:14.5px;padding:10px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text)}
  input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(14,124,102,.2)}
  button{font:inherit;cursor:pointer}
  .btn{padding:12px 18px;border:0;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:14.5px;width:100%}
  .btn:disabled{opacity:.55;cursor:not-allowed}
  .loginErr{display:none;margin-top:12px;padding:10px 12px;border-radius:8px;background:var(--danger-soft);color:var(--danger);font-size:13px}
  .loginErr.show{display:block}
  header.top{display:flex;align-items:center;gap:12px;padding:16px 20px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5}
  header.top .mark{margin:0;width:36px;height:36px;font-size:12px}
  header.top h1{font-size:15px;margin:0;flex:1}
  .iconbtn{background:none;border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:13px;color:var(--text)}
  main{max-width:900px;margin:0 auto;padding:18px 16px 40px}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:16px}
  .stat{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:12px 14px}
  .stat .n{font-size:20px;font-weight:800}
  .stat .l{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .toolbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .toolbar input, .toolbar select{font:inherit;font-size:13.5px;padding:9px 11px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text)}
  .toolbar input{flex:1;min-width:160px}
  .list{display:flex;flex-direction:column;gap:10px}
  .item{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:14px 16px;cursor:pointer}
  .item .row{display:flex;justify-content:space-between;gap:10px;align-items:center}
  .item .name{font-weight:700;font-size:14.5px}
  .item .sub{font-size:12.5px;color:var(--muted);margin-top:3px}
  .badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;text-transform:uppercase;letter-spacing:.03em}
  .badge.novo{background:var(--accent-soft);color:var(--accent)}
  .badge.aprovado{background:#DFF2E1;color:#1E7B34}
  .badge.reprovado{background:var(--danger-soft);color:var(--danger)}
  .empty{text-align:center;color:var(--muted);padding:60px 20px;font-size:14px}
  .overlay{position:fixed;inset:0;background:var(--bg);z-index:20;overflow-y:auto}
  .detailHead{display:flex;align-items:center;gap:12px;padding:16px 20px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0}
  .detailHead h2{font-size:15px;margin:0;flex:1}
  .detailBody{max-width:720px;margin:0 auto;padding:18px 16px 40px}
  .section{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:16px 18px;margin-bottom:12px}
  .section h3{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);margin:0 0 12px}
  .kv{display:grid;grid-template-columns:1fr;gap:10px}
  .kv .k{font-size:11.5px;color:var(--muted);text-transform:uppercase}
  .kv .v{font-size:14px;margin-top:2px;word-break:break-word}
  .statusRow{display:flex;gap:10px;align-items:center}
  .statusRow select{flex:1}
  .img-box{width:100%;max-width:280px;border-radius:8px;overflow:hidden;border:1px solid var(--border);background:var(--surface-2);min-height:120px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px}
  .img-box img{width:100%;display:block}
  .spinner{width:15px;height:15px;border-radius:50%;border:2px solid var(--accent-ink);border-top-color:transparent;animation:spin .7s linear infinite;display:inline-block}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div id="loginView" class="center">
  <div class="loginCard">
    <div class="mark">NMM</div>
    <h1>Painel Administrativo</h1>
    <p>Acesso restrito à equipe NMM.</p>
    <form id="loginForm">
      <div class="field">
        <label for="loginEmail">E-mail</label>
        <input type="email" id="loginEmail" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false">
      </div>
      <div class="field">
        <label for="loginPassword">Senha</label>
        <input type="password" id="loginPassword" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false">
      </div>
      <button type="submit" class="btn" id="loginBtn"><span id="loginBtnLabel">Entrar</span></button>
      <div class="loginErr" id="loginErr"></div>
    </form>
  </div>
</div>

<div id="appView" hidden>
  <header class="top">
    <div class="mark">NMM</div>
    <h1>Cadastros de Profissionais Autônomos</h1>
    <button class="iconbtn" id="logoutBtn">Sair</button>
  </header>
  <main>
    <div class="stats" id="stats"></div>
    <div class="toolbar">
      <input type="text" id="searchInput" placeholder="Buscar por nome, CPF ou cidade...">
      <select id="statusFilter">
        <option value="">Todos os status</option>
        <option value="novo">Novo</option>
        <option value="aprovado">Aprovado</option>
        <option value="reprovado">Reprovado</option>
      </select>
    </div>
    <div class="list" id="listArea"></div>
  </main>
</div>

<div id="detailView" class="overlay" hidden>
  <div class="detailHead">
    <button class="iconbtn" id="backBtn">&larr; Voltar</button>
    <h2 id="detailName">Detalhe</h2>
  </div>
  <div class="detailBody" id="detailBody"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
(function(){
  var SUPABASE_URL = "https://ratkhskpvgvlperrtsvv.supabase.co";
  var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJhdGtoc2twdmd2bHBlcnJ0c3Z2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0MTE5MDAsImV4cCI6MjEwNDk4NzkwMH0.INk9i0RZ_n8OYs85Mh77EaW1vUHN6WszfYKSVe_dQgE";
  var sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  var loginView = document.getElementById("loginView");
  var appView = document.getElementById("appView");
  var detailView = document.getElementById("detailView");
  var loginForm = document.getElementById("loginForm");
  var loginBtn = document.getElementById("loginBtn");
  var loginBtnLabel = document.getElementById("loginBtnLabel");
  var loginErr = document.getElementById("loginErr");

  var candidatos = [];

  loginForm.addEventListener("submit", function(e){
    e.preventDefault();
    loginErr.classList.remove("show");
    var email = document.getElementById("loginEmail").value.trim();
    var password = document.getElementById("loginPassword").value;
    loginBtn.disabled = true;
    loginBtnLabel.innerHTML = '<span class="spinner"></span> Entrando...';
    sb.auth.signInWithPassword({ email: email, password: password }).then(function(res){
      loginBtn.disabled = false;
      loginBtnLabel.textContent = "Entrar";
      if (res.error){
        var msg = "E-mail ou senha incorretos.";
        if (!/invalid login credentials/i.test(res.error.message || "")){
          msg = "Não foi possível entrar: " + res.error.message;
        }
        loginErr.textContent = msg;
        loginErr.classList.add("show");
        return;
      }
      showApp();
    }).catch(function(err){
      loginBtn.disabled = false;
      loginBtnLabel.textContent = "Entrar";
      loginErr.textContent = "Falha de conexão: " + (err && err.message ? err.message : err);
      loginErr.classList.add("show");
    });
  });

  document.getElementById("logoutBtn").addEventListener("click", function(){
    sb.auth.signOut().then(function(){
      appView.hidden = true;
      loginView.hidden = false;
    });
  });

  function showApp(){
    loginView.hidden = true;
    appView.hidden = false;
    loadCandidatos();
  }

  sb.auth.getSession().then(function(res){
    if (res.data && res.data.session){
      showApp();
    }
  });

  function loadCandidatos(){
    sb.from("candidatos").select("*").order("created_at", {ascending:false}).then(function(res){
      if (res.error){
        document.getElementById("listArea").innerHTML = '<div class="empty">Erro ao carregar: ' + res.error.message + '</div>';
        return;
      }
      candidatos = res.data || [];
      renderStats();
      renderList();
    });
  }

  function renderStats(){
    var novo = candidatos.filter(function(c){return c.status === "novo";}).length;
    var aprovado = candidatos.filter(function(c){return c.status === "aprovado";}).length;
    var reprovado = candidatos.filter(function(c){return c.status === "reprovado";}).length;
    document.getElementById("stats").innerHTML =
      statCard(candidatos.length, "Total") +
      statCard(novo, "Novos") +
      statCard(aprovado, "Aprovados") +
      statCard(reprovado, "Reprovados");
  }
  function statCard(n, l){
    return '<div class="stat"><div class="n">' + n + '</div><div class="l">' + l + '</div></div>';
  }

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  function renderList(){
    var q = (document.getElementById("searchInput").value || "").toLowerCase();
    var statusF = document.getElementById("statusFilter").value;
    var filtered = candidatos.filter(function(c){
      if (statusF && c.status !== statusF) return false;
      if (!q) return true;
      return (c.nome_completo||"").toLowerCase().indexOf(q) >= 0 ||
             (c.cpf||"").indexOf(q.replace(/\D/g,"")) >= 0 ||
             (c.cidades_atuacao||"").toLowerCase().indexOf(q) >= 0;
    });
    var el = document.getElementById("listArea");
    if (!filtered.length){
      el.innerHTML = '<div class="empty">Nenhum cadastro encontrado.</div>';
      return;
    }
    el.innerHTML = filtered.map(function(c){
      var d = new Date(c.created_at);
      var dateStr = d.toLocaleDateString("pt-BR") + " " + d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
      return '<div class="item" data-id="' + c.id + '">' +
        '<div class="row">' +
          '<div><div class="name">' + esc(c.nome_completo) + '</div>' +
          '<div class="sub">' + esc(c.cidades_atuacao) + ' &middot; ' + dateStr + '</div></div>' +
          '<span class="badge ' + esc(c.status) + '">' + esc(c.status) + '</span>' +
        '</div></div>';
    }).join("");
    Array.prototype.forEach.call(el.querySelectorAll(".item"), function(node){
      node.addEventListener("click", function(){
        openDetail(node.getAttribute("data-id"));
      });
    });
  }

  document.getElementById("searchInput").addEventListener("input", renderList);
  document.getElementById("statusFilter").addEventListener("change", renderList);

  function fmtCpf(cpf){
    cpf = (cpf||"").replace(/\D/g,"");
    if (cpf.length !== 11) return cpf;
    return cpf.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, "$1.$2.$3-$4");
  }

  function openDetail(id){
    var c = candidatos.filter(function(x){return x.id === id;})[0];
    if (!c) return;
    document.getElementById("detailName").textContent = c.nome_completo;
    var body = document.getElementById("detailBody");
    body.innerHTML =
      '<div class="section"><h3>Status</h3>' +
      '<div class="statusRow">' +
        '<select id="statusSelect">' +
          '<option value="novo"' + (c.status==="novo"?" selected":"") + '>Novo</option>' +
          '<option value="aprovado"' + (c.status==="aprovado"?" selected":"") + '>Aprovado</option>' +
          '<option value="reprovado"' + (c.status==="reprovado"?" selected":"") + '>Reprovado</option>' +
        '</select>' +
        '<button class="btn" id="saveStatusBtn" style="width:auto;padding:10px 16px">Salvar</button>' +
      '</div></div>' +

      '<div class="section"><h3>Dados pessoais</h3><div class="kv">' +
        kv("Nome completo", c.nome_completo) +
        kv("CPF", fmtCpf(c.cpf)) +
        kv("Endereço", c.endereco) +
        kv("Cidades de atuação", c.cidades_atuacao) +
      '</div></div>' +

      '<div class="section"><h3>Experiência</h3><div class="kv">' +
        kv("Função com experiência", c.funcoes_experiencia) +
        kv("Pretende atuar", c.funcoes_pretendidas) +
        kv("Pretende aprender", c.funcoes_aprender) +
        (c.observacao ? kv("Observação", c.observacao) : "") +
      '</div></div>' +

      '<div class="section"><h3>Pagamento</h3><div class="kv">' +
        kv("Banco", c.pix_banco) +
        kv("Tipo de chave PIX", c.pix_tipo) +
        kv("Chave PIX", c.pix_chave) +
      '</div></div>' +

      '<div class="section"><h3>Documentos</h3>' +
        '<div style="display:flex;gap:12px;flex-wrap:wrap">' +
          '<div><div class="kv"><div class="k" style="margin-bottom:6px">Documento</div></div><div class="img-box" id="docBox">Carregando...</div></div>' +
          '<div><div class="kv"><div class="k" style="margin-bottom:6px">Foto atual</div></div><div class="img-box" id="fotoBox">Carregando...</div></div>' +
        '</div>' +
      '</div>' +

      '<div class="section"><h3>Cadastrado em</h3><div class="kv">' + kv("Data", new Date(c.created_at).toLocaleString("pt-BR")) + '</div></div>';

    document.getElementById("saveStatusBtn").addEventListener("click", function(){
      var newStatus = document.getElementById("statusSelect").value;
      saveStatus(c.id, newStatus);
    });

    loadFile(c.documento_path, "docBox");
    loadFile(c.foto_path, "fotoBox");

    detailView.hidden = false;
  }
  function kv(k, v){
    return '<div><div class="k">' + esc(k) + '</div><div class="v">' + esc(v) + '</div></div>';
  }

  function loadFile(path, boxId){
    var box = document.getElementById(boxId);
    if (!path){ box.textContent = "Não enviado"; return; }
    sb.storage.from("candidatos-docs").createSignedUrl(path, 300).then(function(res){
      if (res.error || !res.data){ box.textContent = "Indisponível"; return; }
      var url = res.data.signedUrl;
      if (/\.pdf($|\?)/i.test(path)){
        box.innerHTML = '<a href="' + url + '" target="_blank" rel="noopener">Abrir PDF</a>';
      } else {
        box.innerHTML = '<a href="' + url + '" target="_blank" rel="noopener"><img src="' + url + '"></a>';
      }
    });
  }

  function saveStatus(id, status){
    var btn = document.getElementById("saveStatusBtn");
    btn.disabled = true;
    btn.textContent = "Salvando...";
    sb.from("candidatos").update({status: status}).eq("id", id).then(function(res){
      btn.disabled = false;
      btn.textContent = "Salvar";
      if (res.error){
        alert("Erro ao salvar: " + res.error.message);
        return;
      }
      var c = candidatos.filter(function(x){return x.id === id;})[0];
      if (c) c.status = status;
      renderStats();
      renderList();
    });
  }

  document.getElementById("backBtn").addEventListener("click", function(){
    detailView.hidden = true;
  });
})();
</script>
</body>
</html>
